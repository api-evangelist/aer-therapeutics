name: Aer Therapeutics
description: >-
  Aer Therapeutics is a clinical-stage biopharmaceutical company based in the
  Research Triangle Park / Raleigh area of North Carolina, developing novel
  treatments for muco-obstructive lung diseases such as COPD, asthma, cystic
  fibrosis, and non-CF bronchiectasis. A spinout from Dr. John Fahy's laboratory
  at the University of California, San Francisco (UCSF), the company's lead
  candidate, AER-01 (fexlamose), is an inhaled small-molecule mucolytic designed
  to break down and liquefy the dense mucus plugs that obstruct airflow in the
  lungs. Aer closed a $36 million Series A backed by life-science investors
  including Canaan, OrbiMed, Hatteras Venture Partners, and Pappas Capital. Aer
  Therapeutics is a private, research-focused therapeutics company and does not
  publish a public developer platform, API, or SDKs; this profile captures its
  corporate identity within the API Evangelist network.
